[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-authenticity"
version = "0.1.0"
description = "Offline shadow photo-authenticity training and inference"
requires-python = ">=3.11,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
